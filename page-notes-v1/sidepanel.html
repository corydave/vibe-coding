<!DOCTYPE html>
<!-- v1.0 - initial build -->
<!--
  Page Notes - the side panel. This is an ordinary little web page that
  Chrome shows beside the page you are reading. Its code is in
  sidepanel.js, because extension pages may not have a <script> written
  inside the HTML.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page Notes</title>
  <style>
    :root {
      --bg: #ffffff; --text: #1f2328; --muted: #57606a;
      --line: #d0d7de; --accent: #5b3cc4;
      --bad: #b42318; --good: #1a7f37;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #16181d; --text: #e6e6e6; --muted: #a0a7b0;
        --line: #3a3f48; --accent: #b7a4ff;
        --bad: #ff8a80; --good: #7ee2a8;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 16px; background: var(--bg); color: var(--text);
           font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; }
    h1 { font-size: 1.15rem; margin: 0 0 4px; }
    #page-title { color: var(--muted); margin: 0 0 16px; overflow-wrap: anywhere; }

    /* The counts: a two-column list - name on the left, number on the right. */
    dl { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; margin: 0 0 16px; }
    dt { color: var(--muted); }
    dd { margin: 0; font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }
    .bad  { color: var(--bad); }
    .good { color: var(--good); }

    #message { border-left: 3px solid var(--accent); padding: 4px 10px; margin: 0 0 16px; }

    label { display: block; font-weight: 600; margin-bottom: 6px; }
    textarea { width: 100%; min-height: 140px; padding: 8px; font: inherit;
               color: var(--text); background: var(--bg);
               border: 1px solid var(--line); border-radius: 8px; resize: vertical; }
    #saved { color: var(--muted); font-size: 0.85rem; min-height: 1.2em; margin: 6px 0 0; }

    textarea:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <h1>Page Notes</h1>
  <p id="page-title">Click the Page Notes icon on any web page.</p>

  <!-- Shown instead of the counts when the panel can't see the page.
       role="status" makes a screen reader announce it when it changes. -->
  <p id="message" role="status" hidden></p>

  <dl id="counts" hidden>
    <dt>Words</dt>                  <dd id="words">-</dd>
    <dt>Reading time</dt>           <dd id="reading">-</dd>
    <dt>Links</dt>                  <dd id="links">-</dd>
    <dt>Images</dt>                 <dd id="images">-</dd>
    <dt>Images with no alt text</dt><dd id="no-alt">-</dd>
  </dl>

  <div id="note-area" hidden>
    <label for="note">My note on this page</label>
    <textarea id="note" placeholder="Anything you want to remember about this page."></textarea>
    <p id="saved" aria-live="polite"></p>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
