<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello from Dave</title>
  <style>
    /* The <style> tag is one of the orientation six: it says how things look. */
    body {
      font-family: system-ui, sans-serif;
      max-width: 40rem;
      margin: 3rem auto;
      padding: 0 1rem;
      line-height: 1.6;
    }
    h1 { color: #2b5797; }
  </style>
</head>
<body>
  <!-- Everything a visitor can see lives inside <body>. -->
  <h1>Hello, world - typed by hand.</h1>
  <p>
    Every character of this file was typed, not pasted. It has all six
    landmarks: the doctype, html, head, title, style, and body.
  </p>
  <p>Whitespace does not matter to the browser. It matters to me.</p>

  <script>
    // The <script> tag is the sixth landmark: it says what the page does.
    // This page does almost nothing on purpose.
    console.log("Hello from the console.");
  </script>
</body>
</html>
